name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint includes the Tailwind class rules, so the editor's "Problems" warnings fail here too.
      - run: npm run lint
      - run: npx tsc --noEmit
      # Unit tests plus database tests: every migration applied to an in-memory Postgres, with row-level
      # security enforced, proving one organization can never read or change another's data.
      - run: npm test
